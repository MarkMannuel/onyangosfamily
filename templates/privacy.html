{% extends "base.html" %}

{% block title %}Privacy Settings - Onyango Family{% endblock %}

{% block content %}
<section class="section-padding">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="mb-4"><i class="fas fa-lock text-gradient me-2"></i>Privacy Settings</h2>
                        <form method="post" action="{{ url_for('update_privacy') }}">
                            <div class="mb-3">
                                <label class="form-label">Who can see your profile?</label>
                                <select name="privacy_level" class="form-control">
                                    <option value="public" {% if preference.privacy_level == 'public' %}selected{% endif %}>Public</option>
                                    <option value="family" {% if preference.privacy_level == 'family' %}selected{% endif %}>Family Only</option>
                                    <option value="private" {% if preference.privacy_level == 'private' %}selected{% endif %}>Private</option>
                                </select>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" name="allow_messages" id="allowMessages" {% if preference.allow_messages %}checked{% endif %}>
                                <label class="form-check-label" for="allowMessages">Allow other family members to message me</label>
                            </div>
                            <button class="btn btn-primary" type="submit">Save Preferences</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
