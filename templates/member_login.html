{% extends "base.html" %}

{% block title %}Member Login - Onyango Family{% endblock %}

{% block content %}
<section class="section-padding">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card shadow-lg border-0 animate-fadeIn">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div style="width: 80px; height: 80px; background: var(--gradient-card); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto;">
                                <i class="fas fa-user text-gradient" style="font-size: 36px;"></i>
                            </div>
                            <h3 class="mt-3 mb-2">Member Login</h3>
                            <p class="text-muted">Sign in to your family member account</p>
                        </div>
                        
                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" name="username" class="form-control" required placeholder="Enter your username">
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control" required placeholder="Enter your password">
                            </div>
                            <div class="text-end mb-3">
                                <a href="{{ url_for('forgot_password') }}" class="text-muted small">
                                    <i class="fas fa-key me-1"></i>Forgot Password?
                                </a>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 btn-lg">
                                <i class="fas fa-sign-in-alt me-2"></i>Login
                            </button>
                        </form>
                        
                        <div class="text-center mt-4">
                            <p class="text-muted mb-2">Don't have an account?</p>
                            <a href="{{ url_for('register_member') }}" class="btn btn-outline-primary w-100">
                                <i class="fas fa-user-plus me-2"></i>Register as a Family Member
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
