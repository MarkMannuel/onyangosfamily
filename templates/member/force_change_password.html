{% extends "base.html" %}

{% block title %}Change Password - Onyango Family{% endblock %}

{% block content %}
<section class="section-padding">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card shadow-lg border-0 animate-fadeIn">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div style="width: 80px; height: 80px; background: var(--gradient-card); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto;">
                                <i class="fas fa-exclamation-triangle text-warning" style="font-size: 36px;"></i>
                            </div>
                            <h3 class="mt-3 mb-2">Change Your Password</h3>
                            <p class="text-muted">You are required to change your password before continuing. This is a security measure, especially after a password reset.</p>
                        </div>
                        
                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label">Current Password</label>
                                <input type="password" name="current_password" class="form-control" required placeholder="Enter your current password">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">New Password</label>
                                <input type="password" name="new_password" class="form-control" required minlength="6" placeholder="Enter new password (min. 6 characters)">
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Confirm New Password</label>
                                <input type="password" name="confirm_password" class="form-control" required minlength="6" placeholder="Confirm new password">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 btn-lg">
                                <i class="fas fa-save me-2"></i>Change Password
                            </button>
                        </form>
                        
                        <div class="text-center mt-4">
                            <a href="{{ url_for('member_logout') }}" class="text-danger">
                                <i class="fas fa-sign-out-alt me-1"></i>Logout
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
