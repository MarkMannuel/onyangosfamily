{% extends "base.html" %}

{% block title %}Reset Password - Onyango Family{% endblock %}

{% block content %}
<section class="section-padding">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card shadow-lg border-0 animate-fadeIn">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div style="width: 80px; height: 80px; background: var(--gradient-card); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto;">
                                <i class="fas fa-lock text-gradient" style="font-size: 36px;"></i>
                            </div>
                            <h3 class="mt-3 mb-2">Reset Password</h3>
                            <p class="text-muted">Choose a new password for your account</p>
                        </div>
                        
                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label">New Password</label>
                                <input type="password" name="password" class="form-control" required minlength="6" placeholder="Enter new password (min. 6 characters)">
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Confirm Password</label>
                                <input type="password" name="confirm_password" class="form-control" required minlength="6" placeholder="Confirm new password">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 btn-lg">
                                <i class="fas fa-save me-2"></i>Reset Password
                            </button>
                        </form>
                        
                        <div class="text-center mt-4">
                            <a href="{{ url_for('member_login') }}" class="text-muted">
                                <i class="fas fa-arrow-left me-1"></i>Back to Login
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
